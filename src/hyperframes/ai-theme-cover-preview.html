    .edge-rail {
      position: absolute;
      z-index: 3;
      height: 0;
      border-top: 7px solid var(--stroke);
      border-bottom: 5px solid var(--accent);
      border-radius: 999px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18);
      transform: rotate(var(--rot, 0deg));
      transform-origin: left center;
    }

    .corner-mark {
      display: none;

    .badge {
      position: absolute;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      white-space: nowrap;
    }

    .word {
      position: absolute;
      z-index: 5;
      color: var(--accent);
      font-weight: 950;
      line-height: 0.88;
      letter-spacing: 0;
      -webkit-text-stroke: var(--stroke-width, 8px) var(--stroke);
      paint-order: stroke fill;
      text-shadow:
        0 7px 0 rgba(0,0,0,0.22),
        0 15px 24px rgba(0,0,0,0.26);
      transform: rotate(var(--rot, 0deg));
      transform-origin: var(--origin, left center);
      white-space: nowrap;
    }

    .word.tight {
      line-height: 0.82;
    }

    .word.stack {
      white-space: normal;
      width: var(--w, auto);
    }

    .word.white { color: #fff; }
    .word.dark {
      color: var(--stroke);
      -webkit-text-stroke: 0;
      text-shadow: none;
    }

      position: absolute;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 0 22px;
      border: 6px solid var(--stroke);
      border-radius: 12px;
      background: var(--accent);
      color: var(--stroke);
      font-size: 48px;
      font-weight: 950;
      line-height: 1;
      box-shadow:
        8px 9px 0 rgba(0,0,0,0.26),
        0 18px 30px rgba(0,0,0,0.2);
      transform: rotate(var(--rot, -2deg));
      white-space: nowrap;
    }

    .banner.white {
      background: #fff;
    }

    .mini-card,
    .mini-pill,
    .check-item {
      position: absolute;
      z-index: 5;
      border: 4px solid var(--stroke);
      background: #fff;
      color: var(--stroke);
      font-weight: 950;
      line-height: 1;
      box-shadow:
        6px 7px 0 rgba(0,0,0,0.22),
        0 14px 24px rgba(0,0,0,0.18);
      transform: rotate(var(--rot, 0deg));
      white-space: nowrap;
    }

    .label-row {
      position: absolute;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: rotate(var(--rot, 0deg));
    }

    .label-row .mini-card,
    .label-row .mini-pill {
      position: relative;
    }

    .callout-stack {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform: rotate(var(--rot, 0deg));
    }

    .callout-stack .check-item {
      position: relative;
    }

    .mini-card {
      min-height: 50px;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 28px;
    }

    .mini-pill {
      min-height: 45px;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 25px;
    }

    .check-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 7px 14px 7px 9px;
      border-radius: 10px;
      font-size: 27px;
    }

    .check {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: var(--green);
      color: #fff;
      font-size: 22px;
      font-weight: 950;
      flex: 0 0 auto;
    }

    .question {
      position: absolute;
      z-index: 5;
      color: #fff;
      font-size: 100px;
      font-weight: 950;
      line-height: 1;
      -webkit-text-stroke: 8px var(--stroke);
      paint-order: stroke fill;
      text-shadow:
        0 8px 0 rgba(0,0,0,0.2),
        0 14px 24px rgba(0,0,0,0.24);
      transform: rotate(var(--rot, 0deg));

    .doodle-line {
      position: absolute;
      z-index: 5;
      width: 86px;
      height: 18px;
      border-top: 6px solid var(--accent);
      border-radius: 999px;
      transform: rotate(var(--rot, 0deg));
      filter: drop-shadow(0 4px 0 var(--stroke));
    }

    .sticker-dot {
      position: absolute;
      width: 86px;
      height: 86px;
      border: 5px solid var(--stroke);
      border-radius: 999px;
      background: #fff;
      box-shadow:
        7px 8px 0 rgba(0,0,0,0.25),
        0 18px 28px rgba(0,0,0,0.2);
      transform: rotate(var(--rot, 0deg));
    }

    .sticker-dot::before,
    .sticker-dot::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      top: 38px;
      height: 8px;
      border-radius: 999px;

      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
      -webkit-text-stroke: 5px var(--stroke);

      text-shadow: 0 4px 0 rgba(0,0,0,0.18);

      background: var(--accent);

    function styleFromBox(item) {
      const styles = [
        `left:${item.x}px`,
        `top:${item.y}px`
      ];
      if (item.w) styles.push(`width:${item.w}px`);
      if (item.h) styles.push(`height:${item.h}px`);
      if (item.size) styles.push(`font-size:${item.size}px`);
      if (item.rot !== undefined) styles.push(`--rot:${item.rot}deg`);
      if (item.stroke) styles.push(`--stroke-width:${item.stroke}px`);
      if (item.skewX !== undefined) styles.push(`--skew-x:${item.skewX}deg`);
      if (item.skewY !== undefined) styles.push(`--skew-y:${item.skewY}deg`);
      if (item.scaleX !== undefined) styles.push(`--scale-x:${item.scaleX}`);
      if (item.scaleY !== undefined) styles.push(`--scale-y:${item.scaleY}`);
      if (item.origin) styles.push(`--origin:${item.origin}`);
      return styles.join(";");
    }

    function renderZoneGuide(zone, kind) {
      const shapeClass = zone.shape ? ` ${zone.shape}` : "";
      return `<div class="zone-guide ${kind}${shapeClass}" style="${styleFromBox(zone)}">${zone.id}</div>`;
    }

    function renderZonedElement(item) {
      if (item.type === "word") {
        const colorClass = item.color === "white" ? " white" : item.color === "dark" ? " dark" : "";
        return `<div class="z-word${colorClass}" style="${styleFromBox(item)}">${item.text}</div>`;
      }
      if (item.type === "badge") {
        const bg = item.invert ? "background:#fff;color:var(--stroke);" : "";
        return `<div class="z-badge" style="${styleFromBox(item)};${bg}">${item.text}</div>`;
      }
      if (item.type === "beam") {
        return `<div class="z-beam" style="${styleFromBox(item)}"></div>`;
      }
      if (item.type === "checks") {
        const style = `${styleFromBox(item)};--w:${item.w || 380}px`;
        return `<div class="z-checks" style="${style}">${item.items.map((text) => `<div class="z-pill">${text}</div>`).join("")}</div>`;
      }
      if (item.type === "token") {
        const bg = item.white ? "background:#fff;" : "";
        return `<div class="z-token" style="${styleFromBox(item)};${bg}">${item.text}</div>`;
      }
      if (item.type === "note") {
        return `<div class="z-note" style="${styleFromBox(item)}">${item.text}</div>`;
      }
      return "";
    }

    function toneClass(item) {
      if (item.tone === "white") return " white";
      if (item.tone === "black") return " black";
      if (item.tone === "soft") return " soft";
      return "";
    }

    function extraClass(item) {
      return item.className ? ` ${item.className}` : "";
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resolveSculptItemBox(item, layout) {
      if (item.boxFrom === "line-points" && item.linePoints?.length >= 2) {
        const first = item.linePoints[0];
        const last = item.linePoints[item.linePoints.length - 1];
        const dx = last[0] - first[0];
        const dy = last[1] - first[1];
        const length = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / length;
        const uy = dy / length;
        const nx = -uy;
        const ny = ux;
        const t = item.t ?? 0;
        const parallel = item.parallelOffset ?? 0;
        const normal = item.normalOffset ?? 0;
        const x = first[0] + dx * t + ux * parallel + nx * normal + (item.xOffset || 0);
        const y = first[1] + dy * t + uy * parallel + ny * normal + (item.yOffset || 0);
        return {
          ...item,
          x: Math.round(x),
          y: Math.round(y),
          rot: Number(((Math.atan2(dy, dx) * 180) / Math.PI + (item.rotOffset || 0)).toFixed(2))
        };
      }
      if (item.boxFrom === "contour-points" && item.contourPoints?.length) {
        const xs = item.contourPoints.map((point) => point[0]);
        const ys = item.contourPoints.map((point) => point[1]);
        const size = item.size || 96;
        const padX = item.padX ?? 18;
        const topPad = item.topPad ?? Math.round(size * 0.82);
        const bottomPad = item.bottomPad ?? Math.round(size * 0.3);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);
        return {
          ...item,
          x: Math.round(minX - padX),
          y: Math.round(minY - topPad),
          w: Math.round(maxX - minX + padX * 2),
          h: Math.round(maxY - minY + topPad + bottomPad)
        };
      }
      if (item.boxFrom !== "head-top") return item;
      const zone = (layout?.avoidZones || []).find((entry) => entry.id === (item.anchorZone || "human-face"));
      if (!zone) return item;
      const w = item.w || Math.round(zone.w * (item.widthScale || 1.85));
      const h = item.h || 156;
      const centerX = zone.x + zone.w / 2 + (item.anchorXOffset || 0);
      const x = Math.round(centerX - w / 2);
      const y = Math.round(zone.y - h - (item.anchorGap || 10) + (item.anchorYOffset || 0));
      return { ...item, x, y, w, h };
    }

    function headTopArcPath(item, layout, box) {
      const zone = (layout?.avoidZones || []).find((entry) => entry.id === (item.anchorZone || "human-face"));
      const inset = item.pathInset ?? 8;
      const w = box.w || item.w || 300;
      const h = box.h || item.h || 120;
      if (!zone) return `M${inset},${h - 32} C${w * 0.32},${24} ${w * 0.68},${24} ${w - inset},${h - 36}`;
      const faceCenter = clamp(zone.x + zone.w / 2 - box.x, w * 0.28, w * 0.72);
      const sideY = h - (item.sideLift || 34);
      const archLift = clamp(zone.w * (item.archScale || 0.18), item.minArchLift || 44, item.maxArchLift || 76);
      const crownY = clamp(sideY - archLift, 22, sideY - 28);
      const handle = w * (item.handleScale || 0.26);
      const leftY = sideY + (item.leftDrop || 0);
      const rightY = sideY + (item.rightDrop || 0);
      return `M${inset},${leftY} C${faceCenter - handle},${crownY} ${faceCenter + handle},${crownY} ${w - inset},${rightY}`;
    }

    function contourPointsPath(item, box) {
      const points = (item.contourPoints || []).map(([x, y]) => [Math.round(x - box.x), Math.round(y - box.y)]);
      if (points.length < 2) return item.d || "M0,0";
      if (points.length === 2) return `M${points[0][0]},${points[0][1]} L${points[1][0]},${points[1][1]}`;
      if (points.length === 3) {
        return `M${points[0][0]},${points[0][1]} Q${points[1][0]},${points[1][1]} ${points[2][0]},${points[2][1]}`;
      }
      if (points.length === 4) {
        return `M${points[0][0]},${points[0][1]} C${points[1][0]},${points[1][1]} ${points[2][0]},${points[2][1]} ${points[3][0]},${points[3][1]}`;
      }
      const segments = [`M${points[0][0]},${points[0][1]}`];
      for (let index = 1; index < points.length - 1; index += 1) {
        const next = points[index + 1];
        const midX = Math.round((points[index][0] + next[0]) / 2);
        const midY = Math.round((points[index][1] + next[1]) / 2);
        segments.push(`Q${points[index][0]},${points[index][1]} ${midX},${midY}`);
      }
      const last = points[points.length - 1];
      segments.push(`L${last[0]},${last[1]}`);
      return segments.join(" ");
    }

    function renderSculptElement(item, layout) {
      const resolvedItem = resolveSculptItemBox(item, layout);
      if (item.type === "word") {
        const colorClass = item.color === "white" ? " white" : item.color === "dark" ? " dark" : "";

      if (item.type === "bubble") {

      if (item.type === "stamp") {
        return `<div class="s-stamp${toneClass(item)}${extraClass(item)}" style="${styleFromBox(resolvedItem)}">${item.text}</div>`;
